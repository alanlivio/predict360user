[tool.isort]
profile = "black"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::_pytest.warning_types.PytestDeprecationWarning",
    "ignore::DeprecationWarning:_yaml",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predict360user"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["predict360user*"]